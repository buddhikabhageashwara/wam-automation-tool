<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - WAM Automation Tool</title>
    <link rel="icon" href="image/favicon.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <h2 class="text-center mb-4">Login</h2>
            <img src="image/logo.png" alt="Login Image" class="img-fluid login-logo mb-3">
            <form id="loginForm" class="needs-validation" novalidate>
                <div class="form-group mb-3">
                    <label for="emailField">Email address</label>
                    <input type="email" class="form-control" id="emailField" placeholder="Enter email" required>
                    <div class="invalid-feedback">
                        Please enter a valid email address.
                    </div>
                </div>
                <div class="form-group mb-3">
                    <label for="passwordField">Password</label>
                    <input type="password" class="form-control" id="passwordField" placeholder="Password" required>
                    <div class="invalid-feedback">
                        Password is required.
                    </div>
                </div>
                <div class="form-group mb-3">
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </div>
                <div class="alert alert-danger errorLabel" style="display:none;" role="alert"></div>
            </form>
        </div>
    </div>
</div>

<!-- Include jQuery and login.js -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="js/login.js"></script>
<script src="js/wam-automation-portal-properties.js"></script>
</body>
</html>
