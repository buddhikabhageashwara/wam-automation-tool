<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - WAM Automation Tool</title>
    <link rel="icon" href="image/favicon.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
<div class="container mt-5">
    <h1 class="text-center mb-4"><b>Welcome to WAM Automation Tool</b></h1>
    <div class="row">
        <div class="col-md-3">
            <ul class="list-group" id="menuList">
                <!-- Menu items will be populated here -->
            </ul>
            <button id="logoutButton" class="btn btn-danger mt-3 w-100">Logout</button>
        </div>
        <div class="col-md-9" id="contentArea">
            <!-- Content from selected menu will load here -->
        </div>
    </div>
</div>

<!-- Include jQuery and dashboard.js -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/wam-automation-portal-properties.js"></script>
</body>
</html>
