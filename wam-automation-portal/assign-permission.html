<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assign Permission - WAM Automation Tool</title>
    <link rel="icon" href="image/favicon.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/assign-permission.css">
</head>
<body>
<div class="container mt-5">
    <h2 class="text-center mb-4">Assign Permission to User Type</h2>

    <form id="assignPermissionForm">
        <div class="mb-5">
            <label for="userTypeSelect" class="form-label">Select User Type:</label>
            <select class="form-select" id="userTypeSelect" required>
                <option value="" disabled selected>Select a user type</option>
                <!-- Options will be populated dynamically -->
            </select>
        </div>

        <div class="mb-5">
            <label for="permissionSelect" class="form-label">Select Permission:</label>
            <select class="form-select" id="permissionSelect" required>
                <option value="" disabled selected>Select a permission</option>
                <!-- Options will be populated dynamically -->
            </select>
        </div>

        <button type="submit" class="btn btn-primary" id="assignPermissionBtn">Assign</button>
    </form>

    <div id="errorContainer" class="alert" style="display: none;"></div>
</div>

<!-- Include Bootstrap JS and jQuery -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="js/assign-permission.js"></script>
<script src="js/wam-automation-portal-properties.js"></script>
</body>
</html>
