<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Type - WAM Automation Tool</title>
    <link rel="icon" href="image/favicon.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/user-type.css">
</head>
<body>
<div class="container mt-5">
    <h2 class="text-center mb-4">Add User Type</h2>

    <form id="userTypeForm">
        <div class="mb-3">
            <label for="userTypeName" class="form-label">User Type Name</label>
            <input type="text" class="form-control" id="userTypeName" required>
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea class="form-control" id="description" rows="3"></textarea>
        </div>

        <!-- Error/Success message box placed before the Add button -->
        <div id="errorContainer" class="alert" style="display: none;"></div>

        <button type="submit" class="btn btn-primary" id="addUserTypeBtn">Add</button>
    </form>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="js/user-type.js"></script>
<script src="js/wam-automation-portal-properties.js"></script>
</body>
</html>
