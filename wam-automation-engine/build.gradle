plugins {
	id 'java'
	id 'org.springframework.boot' version '3.2.3'
	id 'io.spring.dependency-management' version '1.1.4'
}

group = 'wam.automationtool'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '17'
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}

	all {
		exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
	}
}

repositories {
	mavenCentral()
}

allprojects {
	repositories {
		maven { url 'https://jitpack.io' }
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-jersey'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.session:spring-session-core'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	implementation group: 'org.springframework.boot', name: 'spring-boot-starter-security'

	implementation 'com.google.code.gson:gson:2.10.1'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-log4j2'

	//jwt
	implementation group: 'com.nimbusds', name: 'nimbus-jose-jwt', version: '9.19'
	implementation group: 'io.jsonwebtoken', name: 'jjwt', version: '0.2'

	// https://mvnrepository.com/artifact/javax.xml.bind/jaxb-api
	implementation 'javax.xml.bind:jaxb-api:2.2.4'

	// https://mvnrepository.com/artifact/com.sun.mail/javax.mail
	implementation 'com.sun.mail:javax.mail:1.6.2'

	// Hibernate dependencies compatible with Spring Boot 3.x
	implementation 'org.hibernate.orm:hibernate-core:6.2.13.Final'
	implementation 'org.hibernate.orm:hibernate-envers:6.2.13.Final'
	implementation 'org.hibernate.orm:hibernate-c3p0:6.2.13.Final'

	implementation 'com.google.api-client:google-api-client:2.0.0'
	implementation 'com.google.oauth-client:google-oauth-client-jetty:1.34.1'
	implementation 'com.google.apis:google-api-services-gmail:v1-rev20220404-2.0.0'

	implementation 'net.coobird:thumbnailator:0.4.14'

	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'org.ehcache:ehcache:3.10.8'

// https://mvnrepository.com/artifact/org.seleniumhq.selenium/selenium-java
	implementation 'org.seleniumhq.selenium:selenium-java:4.19.0'
// https://mvnrepository.com/artifact/io.appium/java-client
	implementation 'io.appium:java-client:9.1.0'


	// WebClient support
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	//MYSQL connector
	runtimeOnly(group: 'mysql', name: 'mysql-connector-java', version: '8.0.33')

    implementation "commons-io:commons-io:2.16.1"
}

tasks.named('test') {
	useJUnitPlatform()
}
